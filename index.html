<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fb"><title>Calendrier de garde</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17233b;background:#f7f8fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{cursor:pointer}.app{max-width:1900px;margin:auto;padding:24px 28px 40px}.header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#68758b;margin:0 0 4px}h1{font-size:clamp(25px,3vw,36px);letter-spacing:-.045em;margin:0}.year{display:flex;align-items:center;gap:12px}.year strong{font-size:30px;font-variant-numeric:tabular-nums;letter-spacing:-.04em;min-width:75px;text-align:center}.icon{height:40px;width:40px;border:1px solid #dce2ea;border-radius:12px;background:white;color:#263550;font-size:24px;line-height:1}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}.main,.notes{background:white;border:1px solid #e3e8ef;border-radius:20px;box-shadow:0 8px 28px rgba(32,50,80,.04)}.toolbar{padding:16px 18px;border-bottom:1px solid #e7ebf1;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.tools{display:flex;gap:6px;flex-wrap:wrap}.tool{border:1px solid #dce2e9;background:#fff;border-radius:11px;padding:9px 12px;font-weight:700;font-size:14px;color:#344158;min-height:40px}.tool.active{outline:2px solid #17233b;outline-offset:1px}.tool.marie{background:#fff0e8;border-color:#f5ad82;color:#a83e0b}.tool.julien{background:#e8f1ff;border-color:#8db8f4;color:#1254a0}.tool.erase{background:#f5f6f8}.divider{height:28px;width:1px;background:#dce2e9}.hint{font-size:13px;color:#657188;margin:0}.legend{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:#617088;padding:11px 20px;background:#fbfcfe;border-bottom:1px solid #e7ebf1}.legend span{display:inline-flex;align-items:center;gap:6px}.swatch{height:11px;width:11px;border-radius:3px;background:#f1f3f6;border:1px solid #d7dce4}.swatch.holiday{background:#e7f4e4;border-color:#b6dab0}.swatch.weekend{background:#eef1f6}.calendar-scroll{overflow-x:auto;overscroll-behavior-x:contain}.mobile-view{display:none}.months{display:grid;grid-template-columns:repeat(12,minmax(99px,1fr));gap:1px;background:#edf0f5;min-width:1220px}.month{background:white;min-width:0}.month-head{height:50px;display:flex;align-items:center;justify-content:center;color:#36465e;font-weight:800;text-transform:uppercase;letter-spacing:.07em;font-size:11px;background:#f7f9fc;border-bottom:1px solid #e6ebf1}.month:nth-child(4n+1) .month-head{color:#135897}.month:nth-child(4n+2) .month-head{color:#b0511f}.month:nth-child(4n+3) .month-head{color:#39714b}.day{height:23px;display:flex;align-items:stretch;border-bottom:1px solid #eef0f3;position:relative;touch-action:pan-y;user-select:none}.day.weekend{background:#f2f4f8}.day.holiday{background:#e7f4e4}.day.today .date{font-weight:900;color:#b23e14}.day.empty{background:#fafbfd;pointer-events:none}.date{width:33px;flex:none;display:flex;align-items:center;padding-left:5px;color:#566377;font-size:11px;font-variant-numeric:tabular-nums;z-index:1;pointer-events:none}.day.weekend .date{font-weight:800}.paint{flex:1;display:flex;flex-direction:column;min-width:0;touch-action:none}.half{flex:1;min-height:0;transition:filter .1s}.half[data-person="marie"]{background:#f1874f}.half[data-person="julien"]{background:#428ce9}.day:hover .half{filter:brightness(.96)}.half:hover{box-shadow:inset 0 0 0 2px rgba(23,35,59,.3)}.month-foot{height:7px;background:#fff}.notes{padding:20px;position:sticky;top:18px}.notes-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.notes h2{font-size:18px;letter-spacing:-.03em;margin:0}.saved{font-size:12px;color:#758197}.notes textarea{display:block;margin-top:16px;width:100%;height:310px;resize:vertical;border:1px solid #dce3ec;background:#fcfdff;border-radius:13px;padding:13px;line-height:1.5;font-size:15px;color:#17233b;outline:none}.notes textarea:focus{border-color:#548fe0;box-shadow:0 0 0 3px #dfeaff}.source{font-size:12px;line-height:1.5;color:#718097;margin:18px 3px 0}.source a{color:#315d94}.empty-year{color:#a25717}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:1100px){.workspace{grid-template-columns:1fr}.notes{position:static}.notes textarea{height:180px}.months{min-width:1220px}}@media(max-width:650px){.app{padding:16px 12px 28px}.header{margin-bottom:15px}.header h1{font-size:26px}.year{display:none}.main,.notes{border-radius:15px}.toolbar{padding:12px;gap:10px}.tools{gap:5px}.tool{font-size:13px;padding:8px 10px}.hint{width:100%}.legend{padding:10px 12px}.calendar-scroll{display:none}.mobile-view{display:block;padding:12px}.mobile-nav{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:12px}.mobile-nav strong{font-size:15px;letter-spacing:-.02em;text-align:center}.mobile-weekdays,.mobile-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.mobile-weekdays{margin-bottom:5px;color:#758197;text-align:center;font-size:12px;font-weight:800}.mobile-grid .day{height:65px;min-width:0;display:flex;flex-direction:column;border:1px solid #e6eaf0;border-radius:8px;overflow:hidden}.mobile-grid .day.weekend{border-color:#d5dbe5}.mobile-grid .date{height:24px;width:auto;flex:none;padding:2px 4px;font-size:12px}.mobile-grid .date small{display:none}.mobile-grid .paint{height:39px;flex:none}.mobile-grid .half{min-height:0}.mobile-grid .day .month-mark{font-size:9px;margin-left:2px;text-transform:uppercase}.notes{padding:16px}}
</style></head><body><div class="app"><header class="header"><div><p class="eyebrow">Garde partagée · Bordeaux</p><h1>Calendrier annuel</h1></div><div class="year"><button class="icon" id="prev" aria-label="Année précédente">‹</button><strong id="year"></strong><button class="icon" id="next" aria-label="Année suivante">›</button></div></header><div class="workspace"><main class="main"><div class="toolbar"><div class="tools" role="group" aria-label="Parent à colorier"><button class="tool marie active" data-person="marie" aria-pressed="true">Marie</button><button class="tool julien" data-person="julien" aria-pressed="false">Julien</button><button class="tool erase" data-person="erase" aria-pressed="false">Effacer</button></div><p class="hint">Cliquer et glisser : moitié haute = matin, moitié basse = soir.</p></div><div class="legend"><span><i class="swatch weekend"></i> Week-end</span><span><i class="swatch holiday"></i> Vacances scolaires · zone A</span><span>Haut = matin · bas = soir</span></div><div class="calendar-scroll"><div class="months" id="months" aria-label="Calendrier annuel"></div></div><div class="mobile-view" id="mobile-view"><div class="mobile-nav"><button class="icon" id="week-prev" aria-label="Semaine précédente">‹</button><strong id="mobile-range"></strong><button class="icon" id="week-next" aria-label="Semaine suivante">›</button></div><div class="mobile-weekdays" aria-hidden="true"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div><div class="mobile-grid" id="mobile-grid" aria-label="Calendrier glissant sur cinq semaines"></div></div></main><aside class="notes"><div class="notes-head"><h2>Bloc-notes</h2><span class="saved" id="saved">Enregistré ici</span></div><textarea id="notes" placeholder="Échanges, horaires, affaires à prévoir…" aria-label="Bloc-notes"></textarea><p class="source" id="source"></p></aside></div></div><script>
(()=>{'use strict';const KEY='garde-partagee-v1',NKEY='garde-notes-v1';let data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{}let year=new Date().getFullYear(),person='marie',drawing=false,last='';const mobileStart=new Date(),months=document.getElementById('months'),mobileGrid=document.getElementById('mobile-grid');mobileStart.setHours(12,0,0,0);mobileStart.setDate(mobileStart.getDate()-((mobileStart.getDay()+6)%7));const yearEl=document.getElementById('year'),notes=document.getElementById('notes'),saved=document.getElementById('saved');const names=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'],week=['D','L','M','M','J','V','S'];
// Dates inclusives pour l'affichage : dernier jour = veille de la rentrée.
const vacations=[['2025-12-20','2026-01-04','Noël'],['2026-02-07','2026-02-22','Hiver'],['2026-04-04','2026-04-19','Printemps'],['2026-07-04','2026-08-31','Été'],['2026-10-17','2026-11-01','Toussaint'],['2026-12-19','2027-01-03','Noël'],['2027-02-13','2027-02-28','Hiver'],['2027-04-10','2027-04-25','Printemps'],['2027-07-03','2027-09-01','Été'],['2027-10-23','2027-11-07','Toussaint'],['2027-12-18','2028-01-02','Noël'],['2028-02-19','2028-03-05','Hiver'],['2028-04-22','2028-05-08','Printemps'],['2028-07-04','2028-09-01','Été']];
function dateKey(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}function holiday(k){return vacations.find(v=>k>=v[0]&&k<=v[1])?.[2]||''}function paintVisual(day){const v=data[day.dataset.key]||{};day.querySelector('[data-half="am"]').dataset.person=v.am||'';day.querySelector('[data-half="pm"]').dataset.person=v.pm||'';day.setAttribute('aria-label',day.dataset.label+`. Matin : ${v.am||'non attribué'}, soir : ${v.pm||'non attribué'}.`)}function apply(day,half){if(!day||!day.classList.contains('day')||!day.dataset.key||last===day.dataset.key+half)return;last=day.dataset.key+half;let v={...(data[day.dataset.key]||{})};v[half]=person==='erase'?'':person;if(!v.am&&!v.pm)delete data[day.dataset.key];else data[day.dataset.key]=v;paintVisual(day);try{localStorage.setItem(KEY,JSON.stringify(data))}catch{saved.textContent='Stockage indisponible'}}function render(){yearEl.textContent=year;const today=new Date(),frag=document.createDocumentFragment();for(let m=0;m<12;m++){const mon=document.createElement('section');mon.className='month';mon.innerHTML=`<div class="month-head">${names[m]}</div>`;const max=new Date(year,m+1,0).getDate();for(let d=1;d<=31;d++){const row=document.createElement('div');if(d>max){row.className='day empty';mon.append(row);continue}const k=dateKey(year,m,d),dt=new Date(year,m,d),dow=dt.getDay(),vac=holiday(k);row.className='day'+((dow===0||dow===6)?' weekend':'')+(vac?' holiday':'')+(today.getFullYear()===year&&today.getMonth()===m&&today.getDate()===d?' today':'');row.dataset.key=k;row.dataset.label=`${d} ${names[m]} ${year}${vac?', vacances de '+vac:''}`;row.title=row.dataset.label;row.tabIndex=0;row.innerHTML=`<span class="date">${String(d).padStart(2,'0')} <small>${week[dow]}</small></span><span class="paint"><span class="half" data-half="am"></span><span class="half" data-half="pm"></span></span>`;paintVisual(row);mon.append(row)}mon.insertAdjacentHTML('beforeend','<div class="month-foot"></div>');frag.append(mon)}months.replaceChildren(frag);renderMobile();document.getElementById('source').innerHTML=(year>=2026&&year<=2028?'Vacances : <a href="https://www.service-public.gouv.fr/particuliers/vosdroits/F31952" target="_blank" rel="noopener">Service-Public.fr</a>. Les vacances commencent après les cours ; les jours indiqués ici sont des repères calendaires.':'Dates des vacances non renseignées pour cette année. Les week-ends et votre garde restent visibles.');}
function renderMobile(){const frag=document.createDocumentFragment(),end=new Date(mobileStart);end.setDate(end.getDate()+34);const fmt=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',year:'numeric'});document.getElementById('mobile-range').textContent=fmt.format(mobileStart)+' – '+fmt.format(end);for(let i=0;i<35;i++){const dt=new Date(mobileStart);dt.setDate(dt.getDate()+i);const y=dt.getFullYear(),m=dt.getMonth(),d=dt.getDate(),k=dateKey(y,m,d),dow=dt.getDay(),vac=holiday(k),row=document.createElement('div');row.className='day'+((dow===0||dow===6)?' weekend':'')+(vac?' holiday':'');row.dataset.key=k;row.dataset.label=`${d} ${names[m]} ${y}${vac?', vacances de '+vac:''}`;row.title=row.dataset.label;row.tabIndex=0;row.innerHTML=`<span class="date">${d}${d===1||i===0?`<small class="month-mark">${names[m].slice(0,3)}</small>`:''}</span><span class="paint"><span class="half" data-half="am"></span><span class="half" data-half="pm"></span></span>`;paintVisual(row);frag.append(row)}mobileGrid.replaceChildren(frag)}
for(const b of document.querySelectorAll('[data-person]'))b.addEventListener('click',()=>{person=b.dataset.person;for(const x of document.querySelectorAll('[data-person]')){x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',x===b)}});document.getElementById('prev').onclick=()=>{year--;render()};document.getElementById('next').onclick=()=>{year++;render()};document.getElementById('week-prev').onclick=()=>{mobileStart.setDate(mobileStart.getDate()-7);renderMobile()};document.getElementById('week-next').onclick=()=>{mobileStart.setDate(mobileStart.getDate()+7);renderMobile()};function hit(x,y){const day=document.elementFromPoint(x,y)?.closest('.day');if(!day||(!months.contains(day)&&!mobileGrid.contains(day))||!day.dataset.key)return null;return {day,half:y<day.getBoundingClientRect().top+day.getBoundingClientRect().height/2?'am':'pm'}}function onPointerDown(e){if(e.button!==0&&e.pointerType==='mouse')return;if(e.pointerType!=='mouse'&&!e.target.closest('.paint'))return;const h=hit(e.clientX,e.clientY);if(!h)return;drawing=true;last='';apply(h.day,h.half);e.preventDefault()}months.addEventListener('pointerdown',onPointerDown);mobileGrid.addEventListener('pointerdown',onPointerDown);document.addEventListener('pointermove',e=>{if(!drawing)return;const h=hit(e.clientX,e.clientY);if(h)apply(h.day,h.half)});document.addEventListener('pointerup',()=>{drawing=false;last=''});document.addEventListener('pointercancel',()=>{drawing=false;last=''});function onKeyDown(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('day')){last='';apply(e.target,e.shiftKey?'pm':'am');e.preventDefault()}}months.addEventListener('keydown',onKeyDown);mobileGrid.addEventListener('keydown',onKeyDown);try{notes.value=localStorage.getItem(NKEY)||''}catch{}notes.addEventListener('input',()=>{try{localStorage.setItem(NKEY,notes.value);saved.textContent='Enregistré ici'}catch{saved.textContent='Stockage indisponible'}});render()})();
</script></body></html>
